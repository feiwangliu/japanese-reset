<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>My Japanese Reset</title>
<style>
:root{--ink:#18332d;--paper:#f3efe5;--red:#c45a3c;--line:#d8d1c4}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Hiragino Sans","Yu Gothic",sans-serif}button{font:inherit}.shell{min-height:100svh;max-width:920px;margin:auto;padding:24px 28px 30px;display:flex;flex-direction:column}.shell header{min-height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:12px;letter-spacing:.18em;font-weight:800;display:flex;align-items:center;gap:11px}.brand span{width:30px;height:30px;display:grid;place-items:center;color:var(--paper);background:var(--ink);border-radius:50%;font-family:serif;font-size:16px}.pill{font-size:9px;letter-spacing:.14em;border:1px solid var(--ink);padding:7px 10px;border-radius:30px;font-weight:800}.hero{padding:clamp(50px,9vh,100px) 0 46px;max-width:700px}.eyebrow{font-size:10px;letter-spacing:.22em;font-weight:900;color:#6c7e76;margin:0 0 20px}.hero h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(52px,10vw,91px);line-height:.98;letter-spacing:-.05em;margin:0;font-weight:500}.hero h1 em{color:var(--red);font-style:normal}.hero>p:not(.eyebrow){margin:30px 0 34px;line-height:1.9;color:#556a62;font-size:15px}.primary,.secondary{border:0;cursor:pointer;min-height:54px;padding:0 22px;border-radius:4px;letter-spacing:.11em;font-size:11px;font-weight:900}.primary{background:var(--ink);color:white;min-width:min(100%,340px);display:inline-flex;align-items:center;justify-content:space-between;gap:25px}.secondary{display:block;margin-top:12px;width:min(100%,340px);background:transparent;border:1px solid var(--line);color:var(--ink)}.stats{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line)}.stats div{padding:21px 0}.stats div+div{border-left:1px solid var(--line);padding-left:22px}.stats small,.results span{display:block;font-size:9px;letter-spacing:.15em;font-weight:800;color:#75857e}.stats strong{display:block;font-family:Georgia,serif;font-size:28px;margin-top:8px;font-weight:500}.stats i{font-size:14px;color:#85938d;font-style:normal}footer{padding-top:17px;font-size:8px;letter-spacing:.13em;color:#89938f}.practice header{gap:18px}.close{border:0;background:transparent;font-size:28px;color:var(--ink);cursor:pointer;padding:0}.bar{height:4px;background:#dfd9ce;flex:1;border-radius:4px;overflow:hidden}.bar span{display:block;height:100%;background:var(--red)}.count{font-size:10px;font-weight:800}.card{width:min(100%,720px);margin:auto;padding:42px 0 30px}.card>h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(29px,6vw,48px);line-height:1.45;font-weight:500;margin:0}.think{margin-top:48px}.think>p{color:#819087;font-size:12px;border-left:3px solid #a8b8a6;padding-left:12px}.hint{background:#e8e2d6;border-radius:6px;padding:16px 18px;margin:20px 0 5px}.hint small{display:block;color:#809087;letter-spacing:.15em;font-size:8px}.hint strong{display:block;margin-top:7px;font-size:19px}.hintBtn{border:0;background:transparent;color:var(--red);text-decoration:underline;padding:16px 0;cursor:pointer;font-size:12px}.wide{display:flex;width:100%;margin-top:12px}.answer{margin-top:40px;border-top:1px solid var(--line);padding-top:26px}.answerHead{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.16em;color:#71837a;font-weight:900}.answerHead button{border:1px solid var(--line);background:transparent;border-radius:30px;padding:8px 12px;font-size:9px;font-weight:900}.jp{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(24px,5vw,37px);line-height:1.65;margin:20px 0 13px}.note{color:#596c64;line-height:1.75;font-size:13px}.tags{display:flex;gap:7px;margin:18px 0 34px}.tags span{border:1px solid #c9c4b8;padding:5px 8px;border-radius:20px;font-size:9px}.rateTitle{font-size:12px;font-weight:700}.ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.ratings button{min-height:70px;border:1px solid var(--line);background:#faf7ef;color:var(--ink);padding:12px 8px;border-radius:5px}.ratings b,.ratings small{display:block}.ratings b{font-size:10px;letter-spacing:.1em}.ratings small{font-size:9px;color:#738079;margin-top:7px}.summary>section{width:min(100%,680px);margin:auto;padding:40px 0}.summary h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(42px,8vw,70px);font-weight:500;margin:0 0 12px}.muted{color:#64746c}.keep{margin:32px 0 25px;border-top:1px solid var(--line)}.keep article{position:relative;padding:22px 50px 22px 0;border-bottom:1px solid var(--line)}.keep article p{font-family:Georgia,"Yu Mincho",serif;font-size:20px;line-height:1.65}.keep article button{position:absolute;right:0;top:28px;border:0;background:var(--ink);color:white;width:34px;height:34px;border-radius:50%}.results{display:flex;gap:24px;margin-bottom:32px}.results b{color:var(--ink);font-family:Georgia,serif;font-size:22px;margin-right:5px}@media(max-width:560px){.shell{padding:18px 20px 24px}.hero{padding-top:58px}.hero h1{font-size:52px}.stats div+div{padding-left:13px}.ratings{grid-template-columns:1fr}.ratings button{min-height:56px;text-align:left;padding-left:16px}.ratings small{display:inline;margin-left:8px}.card{margin:0;padding-top:42px}}
</style></head><body><div id="app"></div>
<script>
const prompts=[
[1,"我本来打算今天做饭，但是太累了，就点了外卖。","～と思ってたのに","今日はご飯を作ろうと思ってたのに、疲れすぎて出前を頼んだ。","本来想做却没有做，用「～ようと思ってたのに」很自然。","本来,结果"],
[2,"我本来只想躺五分钟，醒来时已经过了一个小时。","～つもりだったのに","5分だけ横になるつもりだったのに、目が覚めたらもう1時間も経ってた。","经过了一小时用「1時間経った」，不是「1時間になった」。","时间,结果"],
[3,"我把垃圾放在那里，然后一直忘了拿出去扔。","出し忘れる","ゴミをそこに置いたまま、ずっと出し忘れてた。","忘记拿出去扔是「出し忘れた」。","忘记,动作"],
[4,"水槽在漏水，即使关紧了也停不下来。","ちゃんと閉めても","シンクの水が漏れていて、ちゃんと閉めても止まらない。","描述持续的故障状态，用「～ていて」连接很自然。","故障,状态"],
[5,"家里东西太多了，我不知道该放在哪里。","どこに置けばいいか","家に物が多すぎて、どこに置けばいいかわからない。","不知道应该怎么办，常用「～ばいいかわからない」。","家务,怎么办"],
[6,"我本来想整理抽屉，结果反而弄得更乱了。","かえって","引き出しを整理しようと思ってたのに、かえってぐちゃぐちゃになった。","「かえって」表示结果与期待相反。","本来,反而"],
[7,"我正准备出门，突然下起了大雨。","出かけようとしたら","出かけようとしたら、急に大雨が降り出した。","「～ようとしたら」强调正要做某事时发生了另一件事。","突然,天气"],
[8,"车站前新开了一家面包店，听说特别受欢迎。","～らしい","駅前に新しくパン屋さんがオープンして、すごく人気らしい。","口语中这样连接，比逐字翻译“新开”自然。","传闻,闲聊"],
[9,"我昨天路过的时候，看到很多人在排队。","通りかかったとき","昨日通りかかったとき、たくさんの人が並んでた。","看到具体情景时，直接说「並んでた」即可。","过去,看见"],
[10,"最近孩子好像越来越难早起了。","難しくなってきた","最近、子どもが朝早く起きるのが難しくなってきたみたい。","逐渐变难用「難しくなってきた」。","变化,孩子"],
[11,"我明明放在这里了，怎么找也找不到。","いくら探しても","ここに置いたはずなのに、いくら探しても見つからない。","「はずなのに」适合表达记忆与现实不符。","寻找,反差"],
[12,"我原以为雨很快会停，结果完全没有停。","すぐやむと思ってた","雨はすぐやむと思ってたけど、全然やまなかった。","雨停使用「雨がやむ」。","判断,天气"],
[13,"本来没打算买，看到实物以后还是买了。","買うつもりはなかった","買うつもりはなかったけど、実物を見たら結局買っちゃった。","轻松口语中「～ちゃった」很适合表达最终还是做了。","购物,结果"],
[14,"最近太忙了，完全没有余力练日语。","～する余裕もない","最近忙しすぎて、日本語を練習する余裕も全然なかった。","「余裕がない」比单纯说没有时间更接近忙得顾不过来。","忙碌,最近"],
[15,"以前会说的表达，现在一下子想不起来了。","ぱっと出てこない","前は言えた表現が、今はぱっと出てこなくなった。","词语无法马上从脑中出来，日语常说「出てこない」。","学习,变化"],
[16,"我能听懂，但轮到自己说的时候就卡住了。","自分が話す番になると","聞けばわかるけど、自分が話す番になると言葉が出てこない。","这是描述被动理解强、主动输出弱的自然说法。","口语,学习"],
[17,"我想先确认一下，这个在日本也能使用吗？","念のため確認したい","念のため確認したいんですが、これは日本でも使えますか。","向客服确认时，「～たいんですが」自然且不生硬。","确认,客服"],
[18,"我还没决定，想再考虑一下。","もう少し考えたい","まだ決めていないので、もう少し考えたいです。","拒绝当场决定时，这样说清楚且自然。","决定,委婉"],
[19,"天气这么好，一直待在室内感觉有点可惜。","もったいない気がする","こんなに天気がいいのに、ずっと室内にいるのはちょっともったいない気がする。","这里的「もったいない」表示没有好好利用天气。","天气,感受"],
[20,"停了一段时间以后，感觉忘掉了很多。","しばらくやってなかったら","しばらく練習してなかったら、かなり忘れた気がする。","口语里这样表达自然，也可以说「だいぶ忘れちゃった」。","学习,变化"]].map(x=>({id:x[0],zh:x[1],hint:x[2],ja:x[3],note:x[4],tags:x[5].split(',')}));
const key='jp-reset-progress-v2';let history={};try{history=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let session=[],ratings={},i=0;
const app=document.getElementById('app');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){const v=Object.values(history),got=v.filter(x=>x==='got').length,review=v.filter(x=>x!=='got').length;app.innerHTML=`<main class="shell home"><header><div class="brand"><span>話</span>MY JAPANESE RESET</div><div class="pill">OFFLINE</div></header><section class="hero"><p class="eyebrow">YOUR SPEAKING PRACTICE</p><h1>少しずつ、<br><em>口から戻す。</em></h1><p>忘れたのではなく、少し眠っているだけ。<br>今天把几句日语重新叫醒。</p><button class="primary" onclick="start(5)">START TODAY’S PRACTICE <b>→</b></button><button class="secondary" onclick="start(10)">STANDARD · 10 QUESTIONS</button></section><section class="stats"><div><small>PRACTICED</small><strong>${v.length}<i>/20</i></strong></div><div><small>ACTIVE</small><strong>${got}</strong></div><div><small>TO REVIEW</small><strong>${review}</strong></div></section><footer>WORKS OFFLINE · PROGRESS SAVED ON THIS DEVICE</footer></main>`}
function start(n){session=prompts.map(p=>({p,w:history[p.id]==='again'?0:history[p.id]==='almost'?1:history[p.id]==='got'?3:2,r:Math.random()})).sort((a,b)=>a.w-b.w||a.r-b.r).slice(0,n).map(x=>x.p);ratings={};i=0;question(false,false)}
function question(hint,answer){const p=session[i];app.innerHTML=`<main class="shell practice"><header><button class="close" onclick="home()">×</button><div class="bar"><span style="width:${(i+1)/session.length*100}%"></span></div><div class="count">${i+1} / ${session.length}</div></header><section class="card"><p class="eyebrow">SAY THIS IN JAPANESE</p><h1>${esc(p.zh)}</h1>${!answer?`<div class="think"><p>声に出して言ってみよう</p>${hint?`<div class="hint"><small>ONE WORD</small><strong>${esc(p.hint)}</strong></div>`:''}<button class="hintBtn" onclick="question(true,false)">Give me one word</button><button class="primary wide" onclick="question(${hint},true)">SHOW NATURAL JAPANESE</button></div>`:`<div class="answer"><div class="answerHead">NATURAL JAPANESE <button onclick="speak(${JSON.stringify(p.ja).replace(/"/g,'&quot;')})">▶ LISTEN</button></div><p class="jp">${esc(p.ja)}</p><p class="note">${esc(p.note)}</p><div class="tags">${p.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div><p class="rateTitle">这次你说出来了吗？</p><div class="ratings"><button onclick="rate('got')"><b>GOT IT</b><small>直接说出来了</small></button><button onclick="rate('almost')"><b>ALMOST</b><small>想了一下或看了提示</small></button><button onclick="rate('again')"><b>AGAIN</b><small>这次没说出来</small></button></div></div>`}</section></main>`}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.88;speechSynthesis.speak(u)}
function rate(r){const p=session[i];ratings[p.id]=r;history[p.id]=r;localStorage.setItem(key,JSON.stringify(history));if(i===session.length-1)summary();else{i++;question(false,false)}}
function summary(){let focus=session.filter(p=>ratings[p.id]==='again');if(!focus.length)focus=session.slice(-2);focus=focus.slice(0,2);const count=r=>Object.values(ratings).filter(x=>x===r).length;app.innerHTML=`<main class="shell summary"><header><div class="brand"><span>話</span>TODAY’S RESET</div></header><section><p class="eyebrow">SESSION COMPLETE</p><h1>今日はここまで。</h1><p class="muted">今天不需要记住全部，只留下这两句。</p><div class="keep">${focus.map((p,n)=>`<article><small>KEEP ${n+1}</small><button onclick="speak(${JSON.stringify(p.ja).replace(/"/g,'&quot;')})">▶</button><p>${esc(p.ja)}</p></article>`).join('')}</div><div class="results"><span><b>${count('got')}</b> GOT IT</span><span><b>${count('almost')}</b> ALMOST</span><span><b>${count('again')}</b> AGAIN</span></div><button class="primary" onclick="home()">BACK HOME</button></section></main>`}home();
</script></body></html>
